<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

<h2>Job Application Form</h2>

<form action="response.php" method="post">

Name:<br>
<input type="text" name="name" required><br><br>

Email:<br>
<input type="email" name="email" required><br><br>

Phone Number:<br>
<input type="tel" name="phone" required><br><br>

Preferred Job Role:<br>
<input list="roles" name="role" required>
<datalist id="roles">
    <option value="Web Developer">
    <option value="Data Analyst">
    <option value="Software Tester">
    <option value="UI Designer">
</datalist><br><br>

Highest Qualification:<br>
<select name="qualification">
    <option>B.Sc</option>
    <option>BCA</option>
    <option>B.Tech</option>
    <option>MCA</option>
</select><br><br>

Gender:<br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
<br><br>

Skills:<br>
<input type="checkbox" name="skills[]" value="HTML"> HTML
<input type="checkbox" name="skills[]" value="CSS"> CSS
<input type="checkbox" name="skills[]" value="PHP"> PHP
<input type="checkbox" name="skills[]" value="Python"> Python
<br><br>

Why should we hire you?<br>
<textarea name="about" rows="4" cols="35"></textarea>
<br><br>

<input type="submit" value="Apply">

</form>

</body>
</html>
